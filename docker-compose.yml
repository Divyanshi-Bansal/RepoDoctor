
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repodoctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repodoctor
      POSTGRES_PASSWORD: repodoctor_dev
      POSTGRES_DB: repodoctor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repodoctor -d repodoctor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repodoctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
